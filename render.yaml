services:
  - type: web
    name: supplypilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: PUBLIC_RUN_LIMIT
        value: "5"
      - key: PUBLIC_RUN_WINDOW_SECONDS
        value: "900"
      - key: PUBLIC_MAX_CONCURRENT_RUNS
        value: "2"